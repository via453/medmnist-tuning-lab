# 基线配置：SmallCNN + PneumoniaMNIST（纯 CPU）
# 所有字段都与完整教程 3.2 的 config 字段对照表一一对应。
# 复现：python -m src.run --config configs/base.yaml

dataset: pneumoniamnist
size: 28
data_root: null          # null = 使用 medmnist 默认目录（~/.medmnist）
seed: 0

# 模型
model: smallcnn          # mlp | smallcnn
conv_width: 32
use_bn: true
activation: relu         # relu | gelu
pooling: light           # light（仅一次 2x2 池化）| none  —— C3 笔记：28x28 小图别堆池化
dropout: 0.2
n_classes: 2
n_channels: 1

# 优化
optimizer: adam          # adam | adamw | sgd
lr: 0.001
momentum: 0.9
weight_decay: 0.0001
batch_size: 64
epochs: 20
scheduler: none          # none | step | cosine
warmup_epochs: 0
label_smoothing: 0.0

# 数据
augment: flip            # none | flip | flip_rot
class_weight: none       # none | balanced
early_stop_patience: 5

# 运行
device: cpu
num_workers: 0           # Windows 上保持 0，避免多进程 spawn 问题
limit_train: null        # 冒烟测试用：只取前 N 个训练样本
limit_val: null
out_dir: results
ckpt_dir: outputs
